name: Release

on:
  push:
    tags:
      - 'v*'  # Triggers on tags like v1.0.0, v2.1.3, etc.

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore Thorne-Timer.sln

    - name: Build Release
      run: msbuild Thorne-Timer.sln /p:Configuration=Release /p:Platform="Any CPU" /verbosity:minimal

    - name: Create release package
      run: |
        mkdir release-package
        copy ThorneTimer\bin\Release\ThorneTimer.exe release-package\
        copy ThorneTimer\bin\Release\*.dll release-package\
        copy ThorneTimer\bin\Release\ThorneTimer.exe.config release-package\
        copy README.md release-package\
      shell: cmd

    - name: Create ZIP archive
      run: Compress-Archive -Path release-package\* -DestinationPath ThorneTimer-${{ github.ref_name }}.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: Thorne Timer ${{ github.ref_name }}
        body: |
          ## Thorne Timer ${{ github.ref_name }}
          
          A lightweight overlay timer for EverQuest / Project Quarm.
          
          ### Installation
          1. Download `ThorneTimer-${{ github.ref_name }}.zip`
          2. Extract to a folder of your choice
          3. Run `ThorneTimer.exe`
          
          ### Requirements
          - Windows with .NET Framework 4.8
          - EverQuest with logging enabled (`/log on`)
        files: ThorneTimer-${{ github.ref_name }}.zip
        draft: false
        prerelease: ${{ contains(github.ref_name, '-') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
