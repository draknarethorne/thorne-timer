name: Release

on:
  push:
    tags:
      - 'v*'  # Triggers on tags like v1.0.0, v2.1.3, etc.

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      HAS_SIGNING_CERT: ${{ secrets.SIGNING_CERTIFICATE != '' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Extract version from tag
      id: version
      run: |
        $tag = "${{ github.ref_name }}"
        # Remove 'v' prefix: v0.1.0 -> 0.1.0, v0.6.0-beta -> 0.6.0-beta
        $version = $tag -replace '^v', ''
        # AssemblyVersion must be purely numeric major.minor.build.revision,
        # so strip any pre-release suffix (e.g. "-beta", "-rc1") before
        # splitting. Display/release artifacts keep the full tag.
        $numeric = $version -replace '-.*$', ''
        $parts = $numeric -split '\.' | Select-Object -First 3
        while ($parts.Count -lt 4) { $parts += "0" }
        $assemblyVersion = $parts -join '.'
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        echo "ASSEMBLY_VERSION=$assemblyVersion" >> $env:GITHUB_OUTPUT
        echo "Extracted version: $version -> Assembly: $assemblyVersion"

    - name: Update AssemblyInfo.cs with version
      run: |
        $file = "ThorneTimer/Properties/AssemblyInfo.cs"
        $content = Get-Content $file -Raw
        $newVersion = "${{ steps.version.outputs.ASSEMBLY_VERSION }}"
        $content = $content -replace 'AssemblyVersion\("[^"]*"\)', "AssemblyVersion(`"$newVersion`")"
        $content = $content -replace 'AssemblyFileVersion\("[^"]*"\)', "AssemblyFileVersion(`"$newVersion`")"
        Set-Content $file $content
        echo "Updated AssemblyInfo.cs to version $newVersion"

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore Thorne-Timer.sln

    - name: Build Release
      run: msbuild Thorne-Timer.sln /p:Configuration=Release /p:Platform="Any CPU" /verbosity:minimal

    - name: Create release package
      run: |
        mkdir release-package
        copy ThorneTimer\bin\Release\ThorneTimer.exe release-package\
        copy ThorneTimer\bin\Release\*.dll release-package\
        copy ThorneTimer\bin\Release\ThorneTimer.exe.config release-package\
        copy ThorneTimer\bin\Release\ThorneTimer.ini release-package\
        copy README.md release-package\
        xcopy ThorneTimer\bin\Release\x64 release-package\x64\ /E /I /Y
        xcopy ThorneTimer\bin\Release\x86 release-package\x86\ /E /I /Y
        xcopy ThorneTimer\bin\Release\Sounds release-package\Sounds\ /E /I /Y
        xcopy ThorneTimer\bin\Release\Data release-package\Data\ /E /I /Y
      shell: cmd

    - name: Sign executable
      if: env.HAS_SIGNING_CERT == 'true'
      run: |
        # Decode the base64-encoded .pfx from GitHub secret
        $pfxBytes = [Convert]::FromBase64String("${{ secrets.SIGNING_CERTIFICATE }}")
        $pfxPath = Join-Path $env:RUNNER_TEMP "code_signing.pfx"
        [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)

        # Find signtool.exe (available on windows-latest runners)
        $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1 -ExpandProperty FullName

        # Sign ThorneTimer.exe
        & $signtool sign /f $pfxPath /p "${{ secrets.PFX_PASSWORD }}" /fd sha256 /tr http://timestamp.digicert.com /td sha256 "release-package\ThorneTimer.exe"

        # Clean up
        Remove-Item $pfxPath

    - name: Create ZIP archive
      run: Compress-Archive -Path release-package\* -DestinationPath ThorneTimer-${{ github.ref_name }}.zip

    - name: Compose release body
      id: body
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        $isPre = $tag -match '-'

        # Per-release notes live in Docs/releases/notes/<tag>.md (committed
        # at the same SHA as the tag) so the published release body is
        # self-contained and never relies on the README of a future branch.
        $notesPath = Join-Path $env:GITHUB_WORKSPACE "Docs/releases/notes/$tag.md"
        if (Test-Path $notesPath) {
            $whatsNew = Get-Content $notesPath -Raw
            Write-Host "Using release notes from $notesPath"
        } else {
            $whatsNew = "_Per-release notes were not provided for this tag. See [commit history](https://github.com/draknarethorne/thorne-timer/commits/$tag) for details._"
            Write-Warning "No release notes file found at $notesPath"
        }

        $preReleaseBanner = if ($isPre) {
            "> ⚠️ **Pre-release / Beta build.** This release is published for early testing and feedback. It is feature-complete for its target version but may contain rough edges. Please **back up your ``.tdb`` tome file** before upgrading and [report any issues](https://github.com/draknarethorne/thorne-timer/issues) you encounter.`n"
        } else { "" }

        $body = @"
## ⚔️ Thorne Timer $tag

$preReleaseBanner
**Your EverQuest companion — real-time log parsing, overlay timers, and voice alerts crafted for the way you play.**

Thorne Timer watches your log files in real-time and turns game events into overlay timers, voice alerts, and notifications — giving you the situational awareness that UI files alone can't provide. Whether you're raiding, soloing, or multi-boxing, it keeps the information you need visible and on screen.

Built and tested with the [Project Quarm](https://www.projectquarm.com/) and [TAKP](https://www.takproject.net/) communities, but works with **any EverQuest server** (or any application) that writes text-based log files.

---

### 🆕 What's New in $tag

$whatsNew

---

### ✨ Key Features

- **🎯 Timer Overlays (Mini Views)** — Compact, always-on-top windows that float over your game. User-editable Styles and Views drive routing, color, and warning behavior.
- **⏱️ Real-Time Log Parsing** — Start/end keyword matching, case-sensitive mode, endless (auto-restart) timers, and timer dependencies.
- **🔊 Voice & Sound Alerts** — Text-to-speech and WAV playback with per-timer audio, adjustable volume and speech rate. 200+ built-in sounds organized by category.
- **📊 Timer Styles & Scopes** — Route timers to specific overlay windows by style. Scope timers to World, Character, or Character+ for multi-character setups.
- **🗂️ Tome System** — Portable ``.tdb`` database stores all timers, characters, categories, and settings. Multiple tomes, recent-file switching, and automatic migration from older versions.
- **👥 Multi-Character Support** — Per-character log files, auto-switching from log detection, camp-out auto-pause, independent mini view positions, and class-based timer filtering.
- **🖥️ Compact & Full Views** — Toggle between a compact read-only grid and a full editing view. Column widths, sort state, and window position are all persisted.
- **📁 Configurable Retention** — ``ThorneTimer.ini`` controls log file and database backup retention with a tiered pruning algorithm.

---

### 📦 Installation
1. Download **``ThorneTimer-$tag.zip``** below
2. Extract to a folder of your choice
3. Run **``ThorneTimer.exe``**
4. Point it at your EQ log file and you're ready to go

> 🔄 **Upgrading?** Just extract over your existing folder. Your tome (``.tdb`` database) will be migrated automatically — all your timers, characters, and settings are preserved.

### 🖥️ Requirements
- Windows with .NET Framework 4.8 (included in Windows 10 1903+)
- EverQuest with logging enabled (``/log on``)

### 🔗 Links
- 📖 [README & Documentation](https://github.com/draknarethorne/thorne-timer#readme)
- 🐛 [Report an Issue](https://github.com/draknarethorne/thorne-timer/issues)
- 🎨 [Thorne-UI](https://github.com/draknarethorne/thorne-ui) — the companion in-game UI overhaul for TAKP
"@

        $bodyPath = Join-Path $env:RUNNER_TEMP "release-body.md"
        Set-Content -Path $bodyPath -Value $body -Encoding UTF8
        echo "BODY_PATH=$bodyPath" >> $env:GITHUB_OUTPUT
        echo "Composed release body at $bodyPath ($((Get-Item $bodyPath).Length) bytes)"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: Thorne Timer ${{ github.ref_name }}
        body_path: ${{ steps.body.outputs.BODY_PATH }}
        generate_release_notes: true
        append_body: true
        files: ThorneTimer-${{ github.ref_name }}.zip
        draft: false
        prerelease: ${{ contains(github.ref_name, '-') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
