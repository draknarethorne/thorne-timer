name: "🐛 Bug report"
description: Report a bug found during testing or gameplay.
title: "bug: "
labels: ["bug", "needs-triage"]
assignees:
  - draknarethorne
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Thorne Timer.
        Please include enough detail so this can be reproduced quickly.

  - type: dropdown
    id: component
    attributes:
      label: Component / Area
      description: Where did you see the bug?
      options:
        - Timer Grid (main window)
        - Mini View - Normal
        - Mini View - Buff
        - Mini View - Pet
        - Mini View - Ping
        - Log Monitor / Parsing
        - Character Switching
        - Audio / TTS Alerts
        - Database / Tome
        - Timer Configuration
        - Compact View
        - Window Management
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Thorne Timer version (check title bar or EXE properties)
      placeholder: v0.5.0
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: List clear, numbered steps.
      placeholder: |
        1. Launch ThorneTimer.exe
        2. Create a timer with Style = Buff
        3. Start the timer
        4. Switch characters
        5. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: artifacts
    attributes:
      label: Evidence (optional)
      description: Paste logs, screenshots, error messages, or relevant configuration details.
      render: markdown

  - type: checkboxes
    id: checks
    attributes:
      label: Validation
      options:
        - label: I tested this with the latest version and confirmed it is reproducible.
          required: true
        - label: I checked existing issues to make sure this isn't a duplicate.
          required: false
