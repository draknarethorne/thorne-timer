; ─────────────────────────────────────────────────────────────────
; ThorneTimer.ini — Application configuration for Thorne Timer
; ─────────────────────────────────────────────────────────────────
; Place this file next to ThorneTimer.exe.  Settings here take
; priority over database settings.  If this file is missing or a
; key is absent, built-in defaults (shown below) are used.
;
; Lines starting with ; or # are comments.
; Keys are case-insensitive.  Values are trimmed of whitespace.
; ─────────────────────────────────────────────────────────────────
;
; TIERED RETENTION (applies to both [Logging] and [Backups])
;
; Files are pruned at startup using a tiered algorithm that keeps
; more granularity for recent files and thins out over time:
;
;   Tier 1 — Recent  (0 .. RecentDays)               keep MaxFilesPerDay per day
;   Tier 2 — Daily   (RecentDays+1 .. RetentionDays) keep 1 per day
;   Tier 3 — Monthly (RetentionDays+1 .. MaxAgeDays) keep 1 per month
;   Tier 4 — Expired (older than MaxAgeDays)          delete all
;
; After tiered cleanup, MaxTotalFiles enforces a hard cap on the
; total number of surviving files.
;
; Set any value to 0 to disable that particular limit.
; ─────────────────────────────────────────────────────────────────


; ═════════════════════════════════════════════════════════════════
; DIAGNOSTIC LOGGING
; ═════════════════════════════════════════════════════════════════
[Logging]

; Master switch (true / false).
; Set to false to silence all logging without recompiling.
; Default: true
Enabled=true

; Minimum severity recorded: Debug, Info, Warn, Error
;   Debug — verbose tracing (timer ticks, state dumps)
;   Info  — lifecycle events, character switches, data loads
;   Warn  — unusual but recoverable conditions
;   Error — failures that may affect functionality
; Default: Info
MinLevel=Info

; File mode: Session or Daily
;   Session — one log file per application launch  (ThorneLog_YYYYMMDD_HHmmss.txt)
;   Daily   — one log file per calendar day        (ThorneLog_YYYYMMDD.txt)
; Session is best for debugging; Daily keeps file counts low in production.
; Default: Session
Mode=Session

; ── Tiered retention ──

; Days considered "recent" — Tier 1 keeps MaxFilesPerDay per day.
; Default: 7
RecentDays=7

; Max log files to keep per day during the recent tier.
; Default: 3
MaxFilesPerDay=3

; Days to keep at least 1 file per day (Tier 2).
; Beyond this, files thin to 1 per month until MaxAgeDays.
; Default: 30
RetentionDays=30

; Absolute max age in days.  Everything older is deleted.
; Default: 90
MaxAgeDays=90

; Hard cap on total log files across all tiers.
; Default: 50
MaxTotalFiles=50


; ═════════════════════════════════════════════════════════════════
; TOME (DATABASE) BACKUPS
; ═════════════════════════════════════════════════════════════════
[Backups]

; Master switch for automatic backups at startup.
; Default: true
Enabled=true

; ── Tiered retention ──

; Days considered "recent" — Tier 1 keeps MaxFilesPerDay per day.
; Default: 7
RecentDays=7

; Max backup files to keep per day during the recent tier.
; Default: 5
MaxFilesPerDay=5

; Days to keep at least 1 backup per day (Tier 2).
; Beyond this, backups thin to 1 per month until MaxAgeDays.
; Default: 30
RetentionDays=30

; Absolute max age in days.  Everything older is deleted.
; Backups default to a full year so you can recover from long-ago issues.
; Default: 365
MaxAgeDays=365

; Hard cap on total backup files across all tiers.
; Default: 100
MaxTotalFiles=100
